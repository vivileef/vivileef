name: Metrics

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "github-metrics.svg"
      - "README.md"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: vivileef
          template: classic
          base: activity, community, repositories, metadata
          config_timezone: America/Guayaquil
          config_display: large

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, markdown, json, yaml
          plugin_languages_colors: github

          plugin_streak: yes
          plugin_streak_limit: 5

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_repositories: yes
          plugin_repositories_featured: vivileef/AgroGuardian-AI, vivileef/Gemela-AI, vivileef/SGEpro-react

          plugin_lines: yes
          plugin_lines_sections: total

          committer: yes
          committer_branch: main
          committer_message: "Update github-metrics.svg"
          filename: github-metrics.svg
